<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sweden 2026 — Family Trip</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇸🇪</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ PASSWORD GATE ============ -->
<div id="gate">
  <form id="gate-form">
    <div class="gate-flag">🇸🇪</div>
    <h1>Sweden 2026</h1>
    <p>This is a private family trip planner. Enter the password to continue.</p>
    <input type="password" id="gate-input" placeholder="Password" autocomplete="off" autofocus>
    <button type="submit">Enter</button>
    <p id="gate-error">Wrong password — try again.</p>
  </form>
</div>

<!-- ============ SITE ============ -->
<div id="site" hidden>

  <header id="site-header">
    <div class="header-inner">
      <div class="header-title">
        <span class="flag">🇸🇪</span>
        <div>
          <h1 id="trip-title">Summer 2026 — Stockholm</h1>
          <p id="trip-dates"></p>
        </div>
      </div>
      <button id="lock-btn" title="Lock site">🔒</button>
    </div>
    <nav id="day-nav" aria-label="Day selector"></nav>
  </header>

  <main id="content"></main>

  <footer id="site-footer">
    <p>Built for the Anguera family trip to Sweden · August 2026</p>
  </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
